name: Daily ingest

on:
  schedule:
    # GitHub cron uses UTC. Both hours are scheduled so one lands on 06:00
    # America/New_York across DST changes. Which one actually does the work is
    # decided from database state, not from the clock, because Actions cron is
    # best effort and a late start used to skip the whole day.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      force_all:
        description: Run weekly sources too
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  # Needed to trigger the deploy workflow once fresh rows are in.
  actions: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    # The GDELT backoff alone adds roughly 200 seconds; 15 left no headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11.13"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Decide whether today's ingest still needs to run
        id: schedule
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python .github/scripts/should_run_ingest.py

      - name: Run fault-isolated ingest
        if: steps.schedule.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FORCE_ALL: ${{ inputs.force_all && '1' || '0' }}
        run: python -m ingest.run

      - name: Open or update failure issue
        if: always() && steps.schedule.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/failure_issue.py

      - name: Assert prices actually advanced
        if: steps.schedule.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python .github/scripts/assert_price_freshness.py

      # The site is built from an export of the database rather than by querying
      # it, so fresh rows only reach readers once a deploy re-exports them.
      # Without this the site would show yesterday's numbers until someone
      # pushed code, which is exactly the silent staleness the deploy workflow
      # was written to prevent.
      - name: Publish the new data
        if: steps.schedule.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy to Vercel" --ref main
